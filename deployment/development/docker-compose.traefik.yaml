services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.toml:/traefik.toml
      - ./traefik/acme.json:/acme.json
    networks:
      - sommhai-dev-network

networks:
  sommhai-dev-network:
    driver: bridge
    external: true
