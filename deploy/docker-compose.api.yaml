services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:password@localhost:5432/sommhai
    env_file:
      - ./apps/api/.env
    networks:
      - sommhai-network
    restart: unless-stopped

networks:
  sommhai-network:
    driver: bridge
    attachable: true
